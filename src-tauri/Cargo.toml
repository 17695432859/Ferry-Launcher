[package]
name = "ferry-launcher"
version = "0.2.1"
description = "Ferry Launcher"
authors = ["Ferry Launcher"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ferry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建用：把前端产物打进二进制，而不是连 devUrl
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
trash = "5"
dirs = "5"
base64 = "0.22"
sha1 = "0.10"
md5 = "0.7"
hex = "0.4"
getrandom = "0.2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
# LTO 关掉：fat/thin 在本机（火绒实时扫描 target）会在链接阶段死锁或报「拒绝访问」。
# 构建脚本已把 CARGO_TARGET_DIR 指到 %TEMP% 规避；这里再关 LTO 双保险。
# 代价是 exe 从 ~9MB 涨到 ~10.5MB，换来稳定可复现的构建。
lto = "off"
# 体积优先：unwind 会带来额外的栈展开表，用 z 把能省的空间省回来
opt-level = "z"
# 用 unwind 而不是 abort：单条命令 panic 时只让那次调用失败，
# 不会把整个启动器进程一起带走。配合 util::lock 的毒锁恢复，
# 后台线程出错也不会再表现为「应用突然消失」。
panic = "unwind"
strip = "symbols"
