[package]
name = "ferry-launcher"
version = "0.1.0"
description = "Ferry Launcher"
authors = ["Ferry Launcher"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ferry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建用：把前端产物打进二进制，而不是连 devUrl
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
trash = "5"
dirs = "5"
base64 = "0.22"
sha1 = "0.10"
md5 = "0.7"
hex = "0.4"
getrandom = "0.2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
